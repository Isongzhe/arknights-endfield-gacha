[project]
name = "gacha"
version = "0.2.0"
description = "Exact waiting-time and budget-risk models for gacha banners (Arknights: Endfield)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SUNG-CHE LIN" }]
keywords = ["gacha", "markov-chain", "probability", "risk", "arknights-endfield"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "pandas>=2.2",
]

[project.scripts]
gacha = "gacha.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gacha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", ".superpowers", "docs", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
